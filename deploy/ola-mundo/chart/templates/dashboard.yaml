{{- if .Values.slo.dashboard }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ola-mundo-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: ola-mundo
    app.kubernetes.io/component: slo
data:
  ola-mundo.json: |-
    {{- .Files.Get "files/dashboard.json" | trimSuffix "\n" | nindent 4 }}
{{- end }}
