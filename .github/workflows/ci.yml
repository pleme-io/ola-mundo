name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    uses: pleme-io/substrate/.github/workflows/nix-fleet.yml@main
    with:
      lint: false
      canonical-check: ""
      eval-checks: '["project"]'
    secrets: inherit

  image-scan:
    runs-on: ["self-hosted", "pleme-eval-heavy"]
    steps:
      - uses: actions/checkout@v4
      - run: nix run .#apps.x86_64-linux.scan-images
