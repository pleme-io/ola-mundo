name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resolve:
    uses: pleme-io/substrate/.github/workflows/runner-resolve.yml@main

  checks:
    needs: resolve
    uses: pleme-io/substrate/.github/workflows/nix-fleet.yml@main
    with:
      runner-labels: ${{ format('["{0}"]', needs.resolve.outputs.runner) }}
      lint: false
      canonical-check: ""
      eval-checks: '["project"]'
    secrets: inherit

  image-scan:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pleme-io/actions/nix-setup@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix run .#apps.x86_64-linux.scan-images
